<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SocialFilter 設定</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;color:#182330}fieldset{border:1px solid #bbc6d2;border-radius:8px;margin:1rem 0;padding:1rem}label{display:inline-block;margin:.4rem 1rem .4rem 0}input,select,button{font:inherit;padding:.35rem}button{cursor:pointer;margin:.3rem}table{border-collapse:collapse;width:100%}td,th{padding:.5rem;border-bottom:1px solid #ddd;text-align:left}#status{min-height:1.5rem}small{color:#586878}</style></head>
<body><h1>SocialFilter 設定</h1><p>規則只儲存在這個瀏覽器。匯出 JSON 可手動移到其他裝置。</p>
<fieldset><legend>過濾開關</legend><label><input id="global" type="checkbox">全部啟用</label><label><input id="instagram" type="checkbox">Instagram</label><label><input id="facebook" type="checkbox">Facebook</label><button id="save-settings">儲存開關</button></fieldset>
<h2>規則</h2><table><thead><tr><th>啟用</th><th>名稱</th><th>網站</th><th>條件</th><th>動作</th><th>管理</th></tr></thead><tbody id="rules"></tbody></table>
<form id="editor"><fieldset><legend id="editor-title">新增規則</legend><label>規則 ID <input id="id" required pattern="[A-Za-z0-9._-]+"></label><label><input id="rule-enabled" type="checkbox" checked>啟用</label><br><label><input id="rule-instagram" type="checkbox" checked>Instagram</label><label><input id="rule-facebook" type="checkbox" checked>Facebook</label><br><label>欄位 <select id="field"><option value="text">貼文文字</option><option value="authorHandle">作者帳號</option><option value="contentType">內容類型</option><option value="isRecommended">推薦</option><option value="isSponsored">贊助</option></select></label><label>運算子 <select id="operator"><option value="contains">包含</option><option value="equals">等於</option></select></label><label>值 <input id="value" required></label><br><label>動作 <select id="action"><option value="collapse">折疊</option><option value="hide">隱藏</option><option value="allow">允許</option></select></label><button type="submit">儲存規則</button><button id="clear" type="button">清空表單</button><small>推薦與贊助偵測需要網站適配器實站驗證；未辨識時會放行。</small></fieldset></form>
<h2>規則交換</h2><button id="export">匯出 JSON</button><label>匯入 JSON <input id="import" type="file" accept="application/json,.json"></label><p id="status" role="status"></p><script src="options.js"></script></body></html>
